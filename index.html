<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Notes App</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h1>Sticky Notes</h1>
        
        <!-- Notes Section -->
        <div class="notes-grid" id="notesGrid">
            <!-- New notes will appear here -->
            
            <!-- Input Note inside the grid -->
            <div class="input-note" id="inputContainer">
                <textarea id="noteInput" placeholder="Try a new note..."></textarea>
                <div class="add-btn" id="addBtn">+</div>
            </div>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
